# Render Blueprint Specification for LeakLens Production
# Docs: https://render.com/docs/blueprint-spec

services:
  # LeakLens Production Web Service (Unified Express Backend + Vite React SPA)
  - type: web
    name: leaked-before-the-bell
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        value: https://wnemytwacfsekuwfqadr.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: documents
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
